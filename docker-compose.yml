version: '3'
services:
  psn-backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    volumes:
      - ./output:/app/output
    environment:
      - NPSSO=${NPSSO}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    ports:
      - "8080:8080"

  psn-frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    environment:
      - VITE_ALLOWED_ORIGINS=${VITE_ALLOWED_ORIGINS}
    ports:
      - "5173:5173"
    depends_on:
      - psn-backend